<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            margin: 50px;
        }
        div{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
        }
        .blue{
            background-color: blue;
            left: 50px;
            z-index: 1;
        }
        .red{
            background-color: red;
            left: 90px;
            z-index: 2;
        }
        .green{
            background-color: green;
            left: 130px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blue"></div>
        <div class="red"></div>
        <div class="green"></div>

    </div>
    
</body>
</html>
